spring.application.name=drone

# Configuração do datasource MySQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/drone?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuração da saída de log colorida
spring.output.ansi.enabled=ALWAYS
logging.level.org.hibernate.SQL=DEBUG

logging.level.root=INFO
logging.level.com.example.demo=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.resource=TRACE
